name: Deploy RDS Farm

on:
  push:
    branches: [main]
    paths:
      - '**.bicep'
      - '**.bicepparam'
      - 'dsc/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.bicep'
      - '**.bicepparam'
      - 'dsc/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Main farm: what-if or deploy'
        type: choice
        options: [what-if, deploy]
        default: what-if
      prereqs_action:
        description: 'Prereqs (Key Vault + DSC storage account): use existing, what-if, or deploy new'
        type: choice
        options: [use-existing, what-if, deploy-new]
        default: use-existing

permissions:
  id-token: write   # OIDC federated credential
  contents: read
  pull-requests: write

env:
  AZURE_LOCATION: westeurope
  AZURE_RESOURCE_GROUP: rds-farm-rg
  ARTIFACTS_CONTAINER: dsc
  BICEP_FILE: main.bicep
  BICEPPARAM_FILE: main.bicepparam
  PREREQS_BICEP_FILE: prereqs/main.bicep
  PREREQS_BICEPPARAM_FILE: prereqs/main.bicepparam

jobs:
  lint:
    name: Lint Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Bicep build (main farm)
        run: bicep build "$BICEP_FILE"

      - name: Bicep build-params (main farm)
        env:
          DOMAIN_JOIN_PASSWORD: dummy-for-lint-only
          LOCAL_ADMIN_PASSWORD: dummy-for-lint-only
          ARTIFACTS_SAS: ''
        run: bicep build-params "$BICEPPARAM_FILE"

      - name: Bicep build (prereqs)
        run: bicep build "$PREREQS_BICEP_FILE"

      - name: Bicep build-params (prereqs)
        run: bicep build-params "$PREREQS_BICEPPARAM_FILE"

  prereqs:
    name: Prereqs (KV + Storage)
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'workflow_dispatch' && inputs.prereqs_action != 'use-existing'
    environment: ${{ inputs.prereqs_action == 'deploy-new' && 'production' || 'preview' }}
    outputs:
      artifacts_storage_account: ${{ steps.deploy.outputs.artifacts_storage_account }}
      artifacts_location:        ${{ steps.deploy.outputs.artifacts_location }}
      key_vault_name:            ${{ steps.deploy.outputs.key_vault_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve CI service-principal object ID
        id: spn
        run: |
          set -euo pipefail
          SP_OID=$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query id -o tsv)
          echo "object_id=$SP_OID" >> "$GITHUB_OUTPUT"

      - name: Prereqs what-if
        if: inputs.prereqs_action == 'what-if'
        run: |
          set -euo pipefail
          az deployment sub what-if \
            --location       "$AZURE_LOCATION" \
            --template-file  "$PREREQS_BICEP_FILE" \
            --parameters     "$PREREQS_BICEPPARAM_FILE" \
            --parameters     adminPrincipals='[{"id":"${{ steps.spn.outputs.object_id }}","type":"ServicePrincipal"}]'

      - name: Prereqs deploy
        id: deploy
        if: inputs.prereqs_action == 'deploy-new'
        run: |
          set -euo pipefail
          OUTPUTS=$(az deployment sub create \
            --name           "prereqs-$(date -u +%Y%m%d-%H%M%S)" \
            --location       "$AZURE_LOCATION" \
            --template-file  "$PREREQS_BICEP_FILE" \
            --parameters     "$PREREQS_BICEPPARAM_FILE" \
            --parameters     adminPrincipals='[{"id":"${{ steps.spn.outputs.object_id }}","type":"ServicePrincipal"}]' \
            --query properties.outputs -o json)

          echo "$OUTPUTS"

          SA=$(echo  "$OUTPUTS" | jq -r '.storageAccountName.value')
          LOC=$(echo "$OUTPUTS" | jq -r '.artifactsLocation.value')
          KV=$(echo  "$OUTPUTS" | jq -r '.keyVaultName.value')

          {
            echo "artifacts_storage_account=$SA"
            echo "artifacts_location=$LOC"
            echo "key_vault_name=$KV"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Prereqs deployed"
            echo ""
            echo "- Storage account: \`$SA\`"
            echo "- Artifacts URL:   $LOC"
            echo "- Key Vault:       \`$KV\`"
            echo ""
            echo "> Update repo variable \`ARTIFACTS_STORAGE_ACCOUNT\` to \`$SA\` so the next CI run picks it up without needing to choose 'deploy-new' again."
          } >> "$GITHUB_STEP_SUMMARY"

  package-dsc:
    name: Package DSC
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Zip DSC configuration
        run: |
          cd dsc
          zip -r ../Configuration.zip Configuration.ps1
          unzip -l ../Configuration.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsc-configuration
          path: Configuration.zip
          retention-days: 7

  upload-artifacts:
    name: Upload DSC to storage
    runs-on: ubuntu-latest
    needs: [package-dsc, prereqs]
    # Run when:
    #   - prereqs job succeeded (deploy-new), OR
    #   - prereqs job was skipped (use-existing / non-dispatch events).
    # Stop the chain when prereqs ran in what-if mode (it succeeded but the storage account doesn't exist).
    if: |
      always()
      && needs.package-dsc.result == 'success'
      && (needs.prereqs.result == 'skipped' || (needs.prereqs.result == 'success' && inputs.prereqs_action != 'what-if'))
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    env:
      # Prefer the storage account just created by the prereqs job; otherwise fall back to the repo variable.
      ARTIFACTS_STORAGE_ACCOUNT: ${{ needs.prereqs.outputs.artifacts_storage_account || vars.ARTIFACTS_STORAGE_ACCOUNT }}
    outputs:
      artifacts_location: ${{ steps.urls.outputs.artifacts_location }}
      artifacts_sas: ${{ steps.sas.outputs.sas }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsc-configuration

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload Configuration.zip
        run: |
          az storage blob upload \
            --account-name "$ARTIFACTS_STORAGE_ACCOUNT" \
            --container-name "$ARTIFACTS_CONTAINER" \
            --name Configuration.zip \
            --file Configuration.zip \
            --overwrite \
            --auth-mode login

      - name: Generate short-lived user-delegation SAS
        id: sas
        run: |
          set -euo pipefail
          EXPIRY=$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%MZ')

          SAS=$(az storage blob generate-sas \
            --account-name "$ARTIFACTS_STORAGE_ACCOUNT" \
            --container-name "$ARTIFACTS_CONTAINER" \
            --name Configuration.zip \
            --permissions r \
            --expiry "$EXPIRY" \
            --auth-mode login \
            --as-user \
            --https-only \
            -o tsv)

          echo "::add-mask::$SAS"
          echo "sas=?$SAS" >> "$GITHUB_OUTPUT"

      - name: Compute artifacts URL
        id: urls
        run: |
          URL="https://${ARTIFACTS_STORAGE_ACCOUNT}.blob.core.windows.net/${ARTIFACTS_CONTAINER}/"
          echo "artifacts_location=$URL" >> "$GITHUB_OUTPUT"

  what-if:
    name: What-If
    runs-on: ubuntu-latest
    needs: upload-artifacts
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'what-if')
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        run: |
          az group create -n "$AZURE_RESOURCE_GROUP" -l "$AZURE_LOCATION" -o none

      - name: Bicep what-if
        env:
          DOMAIN_JOIN_PASSWORD: ${{ secrets.DOMAIN_JOIN_PASSWORD }}
          LOCAL_ADMIN_PASSWORD: ${{ secrets.LOCAL_ADMIN_PASSWORD }}
          ARTIFACTS_SAS: ${{ needs.upload-artifacts.outputs.artifacts_sas }}
          ARTIFACTS_LOCATION: ${{ needs.upload-artifacts.outputs.artifacts_location }}
        run: |
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file  "$BICEP_FILE" \
            --parameters     "$BICEPPARAM_FILE" \
            --parameters     artifactsLocation="$ARTIFACTS_LOCATION"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: upload-artifacts
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        run: |
          az group create -n "$AZURE_RESOURCE_GROUP" -l "$AZURE_LOCATION" -o none

      - name: Deploy Bicep
        id: deploy
        env:
          DOMAIN_JOIN_PASSWORD: ${{ secrets.DOMAIN_JOIN_PASSWORD }}
          LOCAL_ADMIN_PASSWORD: ${{ secrets.LOCAL_ADMIN_PASSWORD }}
          ARTIFACTS_SAS: ${{ needs.upload-artifacts.outputs.artifacts_sas }}
          ARTIFACTS_LOCATION: ${{ needs.upload-artifacts.outputs.artifacts_location }}
        run: |
          set -euo pipefail
          OUTPUTS=$(az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file  "$BICEP_FILE" \
            --parameters     "$BICEPPARAM_FILE" \
            --parameters     artifactsLocation="$ARTIFACTS_LOCATION" \
            --query properties.outputs -o json)

          echo "$OUTPUTS"

          FQDN=$(echo "$OUTPUTS" | jq -r '.gatewayFqdn.value')
          URL=$(echo  "$OUTPUTS" | jq -r '.rdWebUrl.value')

          {
            echo "## RDS Farm Deployed"
            echo ""
            echo "- Gateway FQDN: \`$FQDN\`"
            echo "- RD Web URL:   $URL"
          } >> "$GITHUB_STEP_SUMMARY"
