name: Deploy RDS Farm

on:
  # Manual-only: deploys to live Azure infra, so we never run on push/PR.
  # Re-add `push:` / `pull_request:` blocks if you want auto what-if on commits.
  workflow_dispatch:
    inputs:
      action:
        description: 'Main farm: what-if or deploy'
        type: choice
        options: [what-if, deploy]
        default: what-if

permissions:
  id-token: write   # OIDC federated credential
  contents: read

env:
  # AZURE_LOCATION + AZURE_RESOURCE_GROUP are sourced from repo variables that
  # Initialize-RdsFarm.ps1 -> Initialize-CiPrerequisites.ps1 set from your
  # chosen -Location and -FarmResourceGroup. The literals here are fallbacks
  # so the workflow still runs against a never-bootstrapped repo.
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westeurope' }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rds-farm-rg' }}
  ARTIFACTS_CONTAINER: dsc
  BICEP_FILE: main.bicep
  BICEPPARAM_FILE: main.bicepparam
  PREREQS_BICEP_FILE: prereqs/main.bicep
  PREREQS_BICEPPARAM_FILE: prereqs/main.bicepparam

jobs:
  lint:
    name: Lint Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Bicep build (main farm)
        run: bicep build "$BICEP_FILE"

      - name: Bicep build-params (main farm)
        env:
          DOMAIN_JOIN_PASSWORD: dummy-for-lint-only
          LOCAL_ADMIN_PASSWORD: dummy-for-lint-only
        run: bicep build-params "$BICEPPARAM_FILE"

      - name: Bicep build (prereqs)
        run: bicep build "$PREREQS_BICEP_FILE"

      - name: Bicep build-params (prereqs)
        run: bicep build-params "$PREREQS_BICEPPARAM_FILE"

  config-tests:
    name: Config Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: actionlint (workflow syntax + script lint)
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

      - name: markdownlint (README + docs)
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            README.md
            docs/**/*.md

      - name: DSC config — PSScriptAnalyzer, parse, discovery
        shell: pwsh
        run: ./tests/Test-DscConfiguration.ps1

      - name: Bicep param-value sanity (main farm)
        shell: pwsh
        env:
          DOMAIN_JOIN_PASSWORD: dummy-for-validation-only
          LOCAL_ADMIN_PASSWORD: dummy-for-validation-only
        run: ./tests/Test-BicepParamValues.ps1

  package-dsc:
    name: Package DSC
    runs-on: ubuntu-latest
    needs: [lint, config-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Zip DSC configuration
        run: |
          cd dsc
          zip -r ../Configuration.zip Configuration.ps1
          unzip -l ../Configuration.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsc-configuration
          path: Configuration.zip
          retention-days: 7

  upload-artifacts:
    name: Upload DSC to storage
    runs-on: ubuntu-latest
    needs: package-dsc
    env:
      # The artifacts storage account is a Tier 0 prerequisite (provisioned
      # by `scripts/Initialize-RdsFarm.ps1` from your laptop). The repo
      # variable is set by that same script via `gh variable set`.
      ARTIFACTS_STORAGE_ACCOUNT: ${{ vars.ARTIFACTS_STORAGE_ACCOUNT }}
    outputs:
      artifacts_location:        ${{ steps.publish.outputs.artifacts_location }}
      artifacts_storage_account: ${{ steps.publish.outputs.artifacts_storage_account }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate ARTIFACTS_STORAGE_ACCOUNT repo variable
        run: |
          if [ -z "${ARTIFACTS_STORAGE_ACCOUNT:-}" ]; then
            echo "::error::Repo variable ARTIFACTS_STORAGE_ACCOUNT is not set. Run scripts/Initialize-RdsFarm.ps1 (Tier 0) to provision the artifacts storage account and wire the variable."
            exit 1
          fi
          echo "[OK] ARTIFACTS_STORAGE_ACCOUNT=$ARTIFACTS_STORAGE_ACCOUNT"

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish DSC artifact (scripts/Publish-DscArtifact.ps1)
        id: publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = ./scripts/Publish-DscArtifact.ps1 `
              -StorageAccount $env:ARTIFACTS_STORAGE_ACCOUNT `
              -Container      $env:ARTIFACTS_CONTAINER
          "artifacts_location=$($result.ArtifactsLocation)"           | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "artifacts_storage_account=$env:ARTIFACTS_STORAGE_ACCOUNT"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  pre-deploy-checks:
    name: Pre-deploy Infra Checks
    runs-on: ubuntu-latest
    needs: upload-artifacts
    # Read-only validation; runs whenever artifacts were uploaded so what-if
    # and deploy don't waste a slot on a guaranteed-bad config.
    if: always() && needs.upload-artifacts.result == 'success'
    environment: preview
    env:
      ARTIFACTS_LOCATION:        ${{ needs.upload-artifacts.outputs.artifacts_location }}
      # SA name is needed for the MSI-based blob existence check below.
      ARTIFACTS_STORAGE_ACCOUNT: ${{ needs.upload-artifacts.outputs.artifacts_storage_account }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        run: az group create -n "$AZURE_RESOURCE_GROUP" -l "$AZURE_LOCATION" -o none

      - name: Tier 0 prerequisite resources exist
        run: |
          set -euo pipefail
          # The artifacts SA and (when cert binding is enabled) the Key Vault
          # are provisioned by scripts/Initialize-RdsFarm.ps1 from a laptop,
          # not by this pipeline. Verify they're present before we burn time
          # on VNet checks / what-if.
          if ! az storage account show --name "$ARTIFACTS_STORAGE_ACCOUNT" -o none 2>/dev/null; then
            echo "::error::Artifacts storage account '$ARTIFACTS_STORAGE_ACCOUNT' not found. Run scripts/Initialize-RdsFarm.ps1 (Tier 0) to provision it, or update the ARTIFACTS_STORAGE_ACCOUNT repo variable to point at an existing one."
            exit 1
          fi
          echo "[OK] Artifacts storage account '$ARTIFACTS_STORAGE_ACCOUNT' exists"
          # The KV check happens later in the cert-binding-specific step
          # below (skipped when enableCertificateBinding=false, since the
          # farm doesn't need a KV in that mode).

      - name: Resolve existing infra params from bicepparam
        id: params
        env:
          DOMAIN_JOIN_PASSWORD: dummy-for-validation-only
          LOCAL_ADMIN_PASSWORD: dummy-for-validation-only
        run: |
          set -euo pipefail
          # Resolve param values without exposing the compiled file path beyond this step.
          TMP=$(mktemp)
          az bicep build-params --file "$BICEPPARAM_FILE" --outfile "$TMP" >/dev/null
          jqv() { jq -r --arg n "$1" '.parameters[$n].value // empty' "$TMP"; }
          {
            echo "vnet=$(jqv existingVnetName)"
            echo "vnet_rg=$(jqv existingVnetResourceGroup)"
            echo "subnet=$(jqv existingRdsSubnetName)"
            echo "cert_binding=$(jqv enableCertificateBinding)"
            echo "kv_name=$(jqv keyVaultName)"
            echo "kv_rg=$(jqv keyVaultResourceGroup)"
            echo "kv_secret_uri=$(jqv keyVaultCertSecretUri)"
            echo "deploy_bastion=$(jqv deployBastion)"
            echo "bastion_subnet=$(jqv bastionSubnetName)"
            echo "session_count=$(jqv sessionHostCount)"
          } >> "$GITHUB_OUTPUT"
          rm -f "$TMP"

      - name: Existing VNet + subnet present and usable
        env:
          VNET:           ${{ steps.params.outputs.vnet }}
          VNET_RG:        ${{ steps.params.outputs.vnet_rg }}
          SUBNET:         ${{ steps.params.outputs.subnet }}
          DEPLOY_BASTION: ${{ steps.params.outputs.deploy_bastion }}
          BASTION_SUBNET: ${{ steps.params.outputs.bastion_subnet }}
          SESSION_COUNT:  ${{ steps.params.outputs.session_count }}
        run: |
          set -euo pipefail

          if ! az network vnet show -g "$VNET_RG" -n "$VNET" -o none 2>/dev/null; then
            echo "::error::VNet $VNET_RG/$VNET not found"; exit 1
          fi
          echo "[OK] VNet $VNET_RG/$VNET exists"

          SUBNET_JSON=$(az network vnet subnet show -g "$VNET_RG" --vnet-name "$VNET" -n "$SUBNET" -o json 2>/dev/null || true)
          if [ -z "$SUBNET_JSON" ]; then
            echo "::error::Subnet $SUBNET not found in $VNET"; exit 1
          fi
          CIDR=$(echo "$SUBNET_JSON" | jq -r '.addressPrefix // (.addressPrefixes[0])')
          PFX=${CIDR##*/}
          # Available IPs = 2^(32-prefix) - 5 (Azure reserves 5 per subnet)
          AVAILABLE=$(( (1 << (32 - PFX)) - 5 ))
          # Need: gateway + broker + sessionHostCount
          NEEDED=$(( 2 + SESSION_COUNT ))
          echo "[OK] Subnet $SUBNET ($CIDR) has ~$AVAILABLE usable IPs; need $NEEDED"
          if [ "$AVAILABLE" -lt "$NEEDED" ]; then
            echo "::error::Subnet too small: $AVAILABLE usable vs $NEEDED needed"; exit 1
          fi

          if [ "$DEPLOY_BASTION" = "true" ]; then
            if ! az network vnet subnet show -g "$VNET_RG" --vnet-name "$VNET" -n "$BASTION_SUBNET" -o none 2>/dev/null; then
              echo "::error::deployBastion=true but $BASTION_SUBNET not present in $VNET"; exit 1
            fi
            echo "[OK] $BASTION_SUBNET present"
          fi

      - name: Key Vault + cert reachable (if cert binding enabled)
        if: steps.params.outputs.cert_binding == 'true' || steps.params.outputs.cert_binding == 'True'
        env:
          KV:         ${{ steps.params.outputs.kv_name }}
          KV_RG:      ${{ steps.params.outputs.kv_rg }}
          SECRET_URI: ${{ steps.params.outputs.kv_secret_uri }}
        run: |
          set -euo pipefail

          KV_JSON=$(az keyvault show -g "$KV_RG" -n "$KV" -o json 2>/dev/null || true)
          if [ -z "$KV_JSON" ]; then
            echo "::error::Key Vault $KV_RG/$KV not found"; exit 1
          fi
          if [ "$(echo "$KV_JSON" | jq -r '.properties.enableRbacAuthorization')" != "true" ]; then
            echo "::error::Key Vault $KV is in access-policy mode; switch to RBAC (enableRbacAuthorization=true)"; exit 1
          fi
          echo "[OK] Key Vault $KV is RBAC-enabled"

          CERT_NAME=$(echo "$SECRET_URI" | awk -F/ '{print $5}')
          # NOTE: there is no 'az keyvault certificate show-policy' subcommand
          # (despite what the help pages used to suggest); fetch the cert and
          # project the policy with --query. 'az keyvault certificate show'
          # returns the cert object incl. .policy.keyProperties.exportable.
          POLICY=$(az keyvault certificate show --vault-name "$KV" --name "$CERT_NAME" --query policy -o json 2>/dev/null || true)
          if [ -z "$POLICY" ] || [ "$POLICY" = "null" ]; then
            echo "::error::Certificate '$CERT_NAME' not found in $KV (from $SECRET_URI)"; exit 1
          fi
          EXPORTABLE=$(echo "$POLICY" | jq -r '.keyProperties.exportable')
          if [ "$EXPORTABLE" != "true" ]; then
            echo "::error::Cert '$CERT_NAME' policy has exportable=$EXPORTABLE; DSC needs it true. Re-issue with exportable key material."; exit 1
          fi
          echo "[OK] Cert '$CERT_NAME' exists and is exportable"

          EXPIRY=$(az keyvault certificate show --vault-name "$KV" --name "$CERT_NAME" --query attributes.expires -o tsv)
          NOW=$(date -u +%s)
          EXP=$(date -u -d "$EXPIRY" +%s)
          DAYS_LEFT=$(( (EXP - NOW) / 86400 ))
          echo "[OK] Cert valid until $EXPIRY ($DAYS_LEFT days)"
          if [ "$DAYS_LEFT" -lt 30 ]; then
            echo "::warning::Cert expires in $DAYS_LEFT days; consider renewing soon"
          fi

      - name: Artifacts blob exists (managed-identity auth)
        run: |
          set -euo pipefail
          # The SA has allowSharedKeyAccess=false and tenant policy forbids SAS,
          # so we use OAuth via --auth-mode login. The CI SP has Storage Blob
          # Data Contributor on the SA (granted by the Tier 0 bootstrap when
          # scripts/Initialize-RdsFarm.ps1 runs prereqs/main.bicep).
          EXISTS=$(az storage blob exists \
            --account-name   "$ARTIFACTS_STORAGE_ACCOUNT" \
            --container-name "$ARTIFACTS_CONTAINER" \
            --name           Configuration.zip \
            --auth-mode      login \
            --query exists -o tsv)
          if [ "$EXISTS" != "true" ]; then
            echo "::error::Configuration.zip not found in $ARTIFACTS_STORAGE_ACCOUNT/$ARTIFACTS_CONTAINER"; exit 1
          fi
          echo "[OK] Configuration.zip present in $ARTIFACTS_STORAGE_ACCOUNT/$ARTIFACTS_CONTAINER"

      - name: ARM template validate
        env:
          DOMAIN_JOIN_PASSWORD: ${{ secrets.DOMAIN_JOIN_PASSWORD }}
          LOCAL_ADMIN_PASSWORD: ${{ secrets.LOCAL_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          # `validate` checks RBAC + policy + template correctness more strictly
          # than `what-if` (which can mask some errors as ResourceNotFound).
          az deployment group validate \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file  "$BICEP_FILE" \
            --parameters     "$BICEPPARAM_FILE" \
            --parameters     artifactsLocation="$ARTIFACTS_LOCATION" \
            -o none
          echo "[OK] Bicep template validates against current state"

  what-if:
    name: What-If
    runs-on: ubuntu-latest
    needs: [upload-artifacts, pre-deploy-checks]
    # always() opts out of GitHub's implicit success() (which walks the full
    # upstream graph and treats any skipped ancestor as failure). We then
    # explicitly require our two direct needs. Default-safe: anything that
    # isn't an explicit 'deploy' falls through to what-if, which protects
    # against re-runs that lose the original inputs payload.
    if: |
      always()
      && github.event_name == 'workflow_dispatch'
      && inputs.action != 'deploy'
      && needs.upload-artifacts.result == 'success'
      && needs.pre-deploy-checks.result == 'success'
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        run: |
          az group create -n "$AZURE_RESOURCE_GROUP" -l "$AZURE_LOCATION" -o none

      - name: Bicep what-if
        id: whatif
        env:
          DOMAIN_JOIN_PASSWORD: ${{ secrets.DOMAIN_JOIN_PASSWORD }}
          LOCAL_ADMIN_PASSWORD: ${{ secrets.LOCAL_ADMIN_PASSWORD }}
          ARTIFACTS_LOCATION: ${{ needs.upload-artifacts.outputs.artifacts_location }}
        run: |
          set -euo pipefail
          # Capture output so we can both stream it AND reuse it for the
          # job summary. `tee` keeps the console output readable for
          # anyone watching the run live.
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file  "$BICEP_FILE" \
            --parameters     "$BICEPPARAM_FILE" \
            --parameters     artifactsLocation="$ARTIFACTS_LOCATION" \
            2>&1 | tee whatif.txt

      - name: Append what-if to job summary
        if: always() && hashFiles('whatif.txt') != ''
        run: |
          {
            echo "## What-if plan"
            echo ""
            echo '```'
            cat whatif.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [upload-artifacts, pre-deploy-checks]
    # always() opts out of GitHub's implicit success() (see what-if note);
    # then require both direct needs to have succeeded plus an explicit
    # 'deploy' selection (no default fall-through here — deploys must be
    # asked for).
    if: |
      always()
      && github.event_name == 'workflow_dispatch'
      && inputs.action == 'deploy'
      && needs.upload-artifacts.result == 'success'
      && needs.pre-deploy-checks.result == 'success'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        run: |
          az group create -n "$AZURE_RESOURCE_GROUP" -l "$AZURE_LOCATION" -o none

      - name: Deploy Bicep
        id: deploy
        env:
          DOMAIN_JOIN_PASSWORD: ${{ secrets.DOMAIN_JOIN_PASSWORD }}
          LOCAL_ADMIN_PASSWORD: ${{ secrets.LOCAL_ADMIN_PASSWORD }}
          ARTIFACTS_LOCATION: ${{ needs.upload-artifacts.outputs.artifacts_location }}
        run: |
          set -euo pipefail
          OUTPUTS=$(az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file  "$BICEP_FILE" \
            --parameters     "$BICEPPARAM_FILE" \
            --parameters     artifactsLocation="$ARTIFACTS_LOCATION" \
            --query properties.outputs -o json)

          echo "$OUTPUTS"

          FQDN=$(echo "$OUTPUTS" | jq -r '.gatewayFqdn.value')
          URL=$(echo  "$OUTPUTS" | jq -r '.rdWebUrl.value')

          {
            echo "## RDS Farm Deployed"
            echo ""
            echo "- Gateway FQDN: \`$FQDN\`"
            echo "- RD Web URL:   $URL"
          } >> "$GITHUB_STEP_SUMMARY"

  post-deploy-tests:
    name: Post-deploy Infra Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run post-deploy health tests
        shell: pwsh
        run: ./tests/Test-PostDeployHealth.ps1 -ResourceGroupName $env:AZURE_RESOURCE_GROUP

      - name: Append result to job summary
        if: always()
        run: |
          {
            echo "## Post-deploy infra tests"
            echo ""
            echo "Status: \`${{ job.status }}\`"
            echo ""
            echo "See [docs/testing.md](../../docs/testing.md) for the manual checklist."
          } >> "$GITHUB_STEP_SUMMARY"
